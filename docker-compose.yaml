services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      QUEUE_POSTGRES_DB: ${QUEUE_POSTGRES_DB}
      QUEUE_POSTGRES_USER: ${QUEUE_POSTGRES_USER}
      QUEUE_POSTGRES_PASSWORD: ${QUEUE_POSTGRES_PASSWORD}

      TICKETS_POSTGRES_DB: ${TICKETS_POSTGRES_DB}
      TICKETS_POSTGRES_USER: ${TICKETS_POSTGRES_USER}
      TICKETS_POSTGRES_PASSWORD: ${TICKETS_POSTGRES_PASSWORD}

      AVITO_ADAPTER_POSTGRES_DB: ${AVITO_ADAPTER_POSTGRES_DB}
      AVITO_ADAPTER_POSTGRES_USER: ${AVITO_ADAPTER_POSTGRES_USER}
      AVITO_ADAPTER_POSTGRES_PASSWORD: ${AVITO_ADAPTER_POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql
      - ./.docker/postgresql/init.sh:/docker-entrypoint-initdb.d/01-create-service-databases.sh:ro
      - ./.docker/postgresql/healthcheck.sh:/usr/local/bin/postgres-healthcheck:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  wait-for-postgres:
    image: postgres:18-alpine
    entrypoint:
      - sh
      - -c
      - |
        set -e
        until pg_isready -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -p 5432 >/dev/null 2>&1; do
          echo "waiting for postgres..."
          sleep 1
        done
        echo "postgres ready"
    depends_on:
      - postgres
    restart: "no"

  goose:
    build:
      context: ./.docker/goose
      args:
        GOOSE_VERSION: v3.27.3
    environment:
      GOOSE_DRIVER: postgres

      PGHOST: postgres
      PGPORT: "5432"
      PGSSLMODE: disable
      NO_COLOR: "1"

      QUEUE_POSTGRES_DB: ${QUEUE_POSTGRES_DB}
      QUEUE_POSTGRES_USER: ${QUEUE_POSTGRES_USER}
      QUEUE_POSTGRES_PASSWORD: ${QUEUE_POSTGRES_PASSWORD}

      TICKETS_POSTGRES_DB: ${TICKETS_POSTGRES_DB}
      TICKETS_POSTGRES_USER: ${TICKETS_POSTGRES_USER}
      TICKETS_POSTGRES_PASSWORD: ${TICKETS_POSTGRES_PASSWORD}

      AVITO_ADAPTER_POSTGRES_DB: ${AVITO_ADAPTER_POSTGRES_DB}
      AVITO_ADAPTER_POSTGRES_USER: ${AVITO_ADAPTER_POSTGRES_USER}
      AVITO_ADAPTER_POSTGRES_PASSWORD: ${AVITO_ADAPTER_POSTGRES_PASSWORD}
    volumes:
      - ./services/queue/postgresql/migrations:/migrations/queue:ro
      - ./services/tickets/postgresql/migrations:/migrations/tickets:ro
      - ./services/avito-adapter/postgresql/migrations:/migrations/avito-adapter:ro
    depends_on:
      wait-for-postgres:
        condition: service_completed_successfully
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tickets}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tickets}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: services/queue/build/Dockerfile
    environment:
      DATABASE_URL: postgres://${QUEUE_POSTGRES_USER}:${QUEUE_POSTGRES_PASSWORD}@postgres:5432/${QUEUE_POSTGRES_DB}?sslmode=disable
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      goose:
        condition: service_completed_successfully

  tickets:
    build:
      context: .
      dockerfile: services/tickets/build/Dockerfile
    environment:
      DATABASE_URL: postgres://${TICKETS_POSTGRES_USER}:${TICKETS_POSTGRES_PASSWORD}@postgres:5432/${TICKETS_POSTGRES_DB}?sslmode=disable
      AVITO_ADAPTER_URL: http://avito-adapter:8080
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tickets}:${RABBITMQ_PASSWORD:-tickets}@rabbitmq:5672/
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      goose:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      avito-adapter:
        condition: service_healthy
    restart: unless-stopped

  avito-adapter:
    build:
      context: .
      dockerfile: services/avito-adapter/build/Dockerfile
    environment:
      DATABASE_URL: postgres://${AVITO_ADAPTER_POSTGRES_USER}:${AVITO_ADAPTER_POSTGRES_PASSWORD}@postgres:5432/${AVITO_ADAPTER_POSTGRES_DB}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tickets}:${RABBITMQ_PASSWORD:-tickets}@rabbitmq:5672/
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      goose:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./services/frontend
      args:
        VITE_API_URL: "/v1/api"
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      queue:
        condition: service_healthy
      tickets:
        condition: service_healthy
      avito-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
