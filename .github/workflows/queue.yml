name: Queue

on:
  push:
    branches:
      - dev
      - main
    paths:
      - services/queue/**
      - Makefile
      - .github/workflows/queue.yml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        run: make lint-queue

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/queue/go.mod
          cache-dependency-path: services/queue/go.sum
      - name: Generate
        run: make generate-queue
      - name: Build
        run: make build-queue
