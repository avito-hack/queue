name: Queue

on:
  push:
    branches:
      - dev
      - main
    paths:
      - services/queue/**
      - Makefile
      - .golangci.yaml
      - .github/workflows/queue.yml
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/queue/go.mod
          cache-dependency-path: services/queue/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate
        run: make generate-queue
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: services/queue
      - name: Lint OpenAPI
        run: make lint-queue

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/queue/go.mod
          cache-dependency-path: services/queue/go.sum
      - name: Generate
        run: make generate-queue
      - name: Build
        run: make build-queue

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/queue/go.mod
          cache-dependency-path: services/queue/go.sum
      - name: Generate
        run: make generate-queue
      - name: Test
        working-directory: services/queue
        run: go test ./...
