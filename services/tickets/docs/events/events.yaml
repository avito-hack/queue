asyncapi: 3.0.0
info:
  title: Tickets service events
  version: 1.0.0
  description: Исходящие события завершения жизненного цикла права на создание заказа.
defaultContentType: application/json

servers:
  rabbitmq:
    host: rabbitmq:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: RabbitMQ broker
    security:
      - $ref: "#/components/securitySchemes/brokerCredentials"

channels:
  ticketClosed:
    address: ticket.closed
    description: Тикет закрыт до создания заказа, право на покупку освобождено.
    messages:
      ticketClosed:
        $ref: "#/components/messages/ticketClosed"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: domain.events
          type: topic
          durable: true
          autoDelete: false
        bindingVersion: 0.3.0

  ticketRedeemed:
    address: ticket.redeemed
    description: Право по тикету использовано для создания стандартного заказа Авито.
    messages:
      ticketRedeemed:
        $ref: "#/components/messages/ticketRedeemed"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: domain.events
          type: topic
          durable: true
          autoDelete: false
        bindingVersion: 0.3.0

operations:
  sendTicketClosed:
    action: send
    channel:
      $ref: "#/channels/ticketClosed"
    messages:
      - $ref: "#/channels/ticketClosed/messages/ticketClosed"
    bindings:
      amqp:
        deliveryMode: 2
        mandatory: false
        timestamp: true
        bindingVersion: 0.3.0

  sendTicketRedeemed:
    action: send
    channel:
      $ref: "#/channels/ticketRedeemed"
    messages:
      - $ref: "#/channels/ticketRedeemed/messages/ticketRedeemed"
    bindings:
      amqp:
        deliveryMode: 2
        mandatory: false
        timestamp: true
        bindingVersion: 0.3.0

components:
  securitySchemes:
    brokerCredentials:
      type: userPassword

  messages:
    ticketClosed:
      name: ticket.closed
      title: Ticket closed
      summary: Тикет закрыт по отказу, истечению срока активации или отзыву права системой.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ticketClosedPayload"
      bindings:
        amqp:
          messageType: ticket.closed
          bindingVersion: 0.3.0

    ticketRedeemed:
      name: ticket.redeemed
      title: Ticket redeemed
      summary: Тикет погашен успешным созданием заказа; дальнейшая оплата и резервация находятся вне tickets.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ticketRedeemedPayload"
      bindings:
        amqp:
          messageType: ticket.redeemed
          bindingVersion: 0.3.0

  schemas:
    ticketClosedPayload:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - queue_entry_id
        - user_id
        - listing_id
        - sku_id
        - status
        - close_reason
        - finished_at
      properties:
        ticket_id:
          type: string
          format: uuid
        queue_entry_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        sku_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - closed
        close_reason:
          type: string
          enum:
            - activation_timeout
            - user_declined
            - listing_closed
            - system_cancelled
        finished_at:
          type: string
          format: date-time

    ticketRedeemedPayload:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - user_id
        - order_id
        - checkout_url
        - status
        - redeemed_at
      properties:
        ticket_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        checkout_url:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - redeemed
        redeemed_at:
          type: string
          format: date-time
